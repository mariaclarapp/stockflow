<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" width="360" height="620" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#108b7f"/>
      <stop offset="1" stop-color="#065a51"/>
    </linearGradient>

    <!-- Frasco de xarope (origem: canto inferior esquerdo) -->
    <symbol id="syrup" overflow="visible">
      <rect x="8" y="-56" width="14" height="12" fill="currentColor"/>
      <rect x="6" y="-62" width="18" height="7" rx="2" fill="#fff" fill-opacity="0.85"/>
      <rect x="0" y="-46" width="30" height="46" rx="7" fill="currentColor"/>
      <rect x="4" y="-32" width="22" height="20" rx="3" fill="#fff" fill-opacity="0.75"/>
      <rect x="13" y="-28" width="4" height="12" rx="1" fill="#0b6f65"/>
      <rect x="9" y="-24" width="12" height="4" rx="1" fill="#0b6f65"/>
    </symbol>

    <!-- Frasco de comprimidos -->
    <symbol id="pill" overflow="visible">
      <rect x="1" y="-46" width="26" height="10" rx="3" fill="#fff" fill-opacity="0.85"/>
      <rect x="0" y="-38" width="28" height="38" rx="5" fill="currentColor"/>
      <rect x="3" y="-28" width="22" height="18" rx="2" fill="#fff" fill-opacity="0.7"/>
    </symbol>

    <!-- Caixa grande -->
    <symbol id="boxL" overflow="visible">
      <rect x="0" y="-38" width="50" height="38" rx="4" fill="currentColor"/>
      <rect x="0" y="-16" width="50" height="7" fill="#fff" fill-opacity="0.55"/>
      <rect x="22" y="-33" width="6" height="14" rx="1" fill="#0b6f65"/>
      <rect x="18" y="-29" width="14" height="6" rx="1" fill="#0b6f65"/>
    </symbol>

    <!-- Caixa pequena -->
    <symbol id="boxS" overflow="visible">
      <rect x="0" y="-30" width="36" height="30" rx="4" fill="currentColor"/>
      <rect x="0" y="-12" width="36" height="6" fill="#fff" fill-opacity="0.55"/>
      <rect x="15" y="-26" width="6" height="12" rx="1" fill="#0b6f65"/>
      <rect x="12" y="-23" width="12" height="6" rx="1" fill="#0b6f65"/>
    </symbol>

    <!-- Cartela de comprimidos -->
    <symbol id="blister" overflow="visible">
      <rect x="0" y="-34" width="40" height="34" rx="4" fill="currentColor"/>
      <g fill="#fff" fill-opacity="0.75">
        <circle cx="10" cy="-24" r="4"/><circle cx="20" cy="-24" r="4"/><circle cx="30" cy="-24" r="4"/>
        <circle cx="10" cy="-11" r="4"/><circle cx="20" cy="-11" r="4"/><circle cx="30" cy="-11" r="4"/>
      </g>
    </symbol>

    <!-- Bisnaga -->
    <symbol id="tube" overflow="visible">
      <rect x="0" y="-48" width="16" height="4" rx="1" fill="#fff" fill-opacity="0.5"/>
      <rect x="0" y="-45" width="16" height="39" rx="3" fill="currentColor"/>
      <rect x="3" y="-6" width="10" height="6" rx="1" fill="#fff" fill-opacity="0.85"/>
      <rect x="4" y="-34" width="8" height="14" rx="2" fill="#fff" fill-opacity="0.6"/>
    </symbol>
  </defs>

  <!-- Cartão da prateleira -->
  <rect x="30" y="130" width="300" height="445" rx="20" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Prateleiras -->
  <g fill="#cfeae6">
    <rect x="48" y="240" width="264" height="5" rx="2.5" fill-opacity="0.85"/>
    <rect x="48" y="340" width="264" height="5" rx="2.5" fill-opacity="0.85"/>
    <rect x="48" y="440" width="264" height="5" rx="2.5" fill-opacity="0.85"/>
    <rect x="48" y="540" width="264" height="5" rx="2.5" fill-opacity="0.85"/>
  </g>
  <g fill="#000" fill-opacity="0.12">
    <rect x="48" y="245" width="264" height="3" rx="1.5"/>
    <rect x="48" y="345" width="264" height="3" rx="1.5"/>
    <rect x="48" y="445" width="264" height="3" rx="1.5"/>
    <rect x="48" y="545" width="264" height="3" rx="1.5"/>
  </g>

  <!-- Fileira 1 (base y=237) -->

  <use href="#syrup" x="70" y="237" color="#d3ece9"/>
  <use href="#boxL" x="114" y="237" color="#ffe5a0"/>
  <use href="#pill" x="178" y="237" color="#f0b64f"/>
  <use href="#blister" x="220" y="237" color="#a9d9d5"/>
  <use href="#tube" x="274" y="237" color="#d3ece9"/>

  <!-- Fileira 2 (base y=337) -->

  <use href="#pill" x="61" y="337" color="#a9d9d5"/>
  <use href="#boxL" x="99" y="337" color="#d3ece9"/>
  <use href="#syrup" x="159" y="337" color="#ffe5a0"/>
  <use href="#boxS" x="199" y="337" color="#f0b64f"/>
  <use href="#tube" x="245" y="337" color="#ffe5a0"/>
  <use href="#pill" x="271" y="337" color="#d3ece9"/>

  <!-- Fileira 3 (base y=437) -->

  <use href="#boxL" x="60" y="437" color="#f0b64f"/>
  <use href="#pill" x="124" y="437" color="#d3ece9"/>
  <use href="#blister" x="166" y="437" color="#ffe5a0"/>
  <use href="#syrup" x="220" y="437" color="#a9d9d5"/>
  <use href="#boxS" x="264" y="437" color="#ffe5a0"/>

  <!-- Fileira 4 (base y=537) -->

  <use href="#syrup" x="55" y="537" color="#ffe5a0"/>
  <use href="#pill" x="95" y="537" color="#a9d9d5"/>
  <use href="#boxL" x="133" y="537" color="#d3ece9"/>
  <use href="#tube" x="193" y="537" color="#f0b64f"/>
  <use href="#blister" x="219" y="537" color="#a9d9d5"/>
  <use href="#boxS" x="269" y="537" color="#ffe5a0"/>

  <!-- Círculo com + : centro exatamente na borda superior do cartão, centralizado na horizontal -->
  <circle cx="180" cy="130" r="46" fill="#fff" fill-opacity="0.2" stroke="#fff" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="162" y="126" width="36" height="8" rx="4" fill="#fff"/>
  <rect x="176" y="112" width="8" height="36" rx="4" fill="#fff"/>
</svg>
